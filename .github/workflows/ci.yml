name: CI

on:
  push:
    branches: [main]
    tags: ['v*']          # pushing a vX.Y.Z tag builds, tests, and publishes
  pull_request:
  workflow_dispatch:

# Least privilege by default; the publish job widens this for OIDC.
permissions:
  contents: read

# Supersede in-progress runs for the same PR ref, but never cancel a main/tag build
# (a cancelled tag build would skip the publish).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (py${{ matrix.python-version }}${{ matrix.pyld != 'latest' && format(', pyld {0}', matrix.pyld) || '' }}${{ matrix.httpx != 'latest' && format(', httpx {0}', matrix.httpx) || '' }}${{ matrix.pyjwt != 'latest' && format(', pyjwt {0}', matrix.pyjwt) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 3.10 is end-of-life (2026-10-01) and deprecated, not removed: it stays in the
    # matrix — including the floor legs — until 2.0 raises requires-python (#74).
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        pyld: ['latest']
        extras: ['all']
        httpx: ['latest']
        pyjwt: ['latest']
        include:
          # The [data-integrity] floor edge (#124): oldest supported pyld on the
          # oldest Python; every other job resolves the newest pyld (3.x). The
          # golden fixtures are the canonicalization-drift alarm on both edges.
          - python-version: '3.10'
            pyld: '2.0.4'
            extras: 'all'
            httpx: 'latest'
            pyjwt: 'latest'
          # The [ebsi] floor edge (#322): the oldest httpx the extra declares
          # (httpx>=0.27), where the resolved-address guard's pinned request
          # (Client.stream with headers= and the sni_hostname extension) is exercised.
          - python-version: '3.10'
            pyld: 'latest'
            extras: 'all'
            httpx: '0.27.0'
            pyjwt: 'latest'
          # The core floor edge (#340): the oldest PyJWT pyproject declares
          # (pyjwt>=2.13, the security floor of #125). Without it a change that
          # works on the newest PyJWT and breaks on the floor passes every job; the
          # release behaviours do differ (#339 passed a local 2.13.0 gate and failed
          # three tests on 2.15.1).
          - python-version: '3.10'
            pyld: 'latest'
            extras: 'all'
            httpx: 'latest'
            pyjwt: '2.13.0'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Only consulted while a version line has no GA build yet (today: none);
          # kept so the next interpreter can join the matrix as a pre-release.
          allow-prereleases: true
          cache: pip

      - name: Install (core + [${{ matrix.extras }}])
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]"
          if [ "${{ matrix.pyld }}" != "latest" ]; then pip install "pyld==${{ matrix.pyld }}"; fi
          if [ "${{ matrix.httpx }}" != "latest" ]; then pip install "httpx==${{ matrix.httpx }}"; fi
          if [ "${{ matrix.pyjwt }}" != "latest" ]; then pip install "pyjwt==${{ matrix.pyjwt }}"; fi

      # Show which PyJWT this job tests, so a reviewer can see the floor leg ran the
      # floor; on a pinned leg a different version fails the job instead of passing
      # on the wrong one.
      - name: Report PyJWT
        run: |
          python -c "import jwt; print('PyJWT', jwt.__version__)"
          if [ "${{ matrix.pyjwt }}" != "latest" ]; then
            python -c "import jwt, sys; sys.exit(0 if jwt.__version__ == sys.argv[1] else 'expected PyJWT ' + sys.argv[1])" "${{ matrix.pyjwt }}"
          fi

      - name: Lint (flake8)
        run: flake8 src tests

      - name: Type check (mypy)
        run: mypy

      # Offline tier only: the live EBSI smoke test stays opt-in
      # (OPENVC_EBSI_LIVE=1) so CI never depends on an external service.
      - name: Test (pytest + coverage)
        run: >-
          pytest -q --cov=openvc --cov=openvc_ebsi
          --cov-report=term-missing
          --cov-fail-under=85

  publish:
    name: Publish to PyPI
    # Fires only when a vX.Y.Z tag is pushed, and only if the whole test matrix
    # passed. Uses PyPI Trusted Publishing (OIDC) — no API token in the repo.
    # PREREQUISITE: configure openvc's trusted publisher on PyPI (this repo +
    # this workflow + the `pypi` environment) before the first tag push.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read         # checkout (a job-level permissions block replaces the
      id-token: write        # workflow default, so re-grant read) + OIDC for publishing
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
